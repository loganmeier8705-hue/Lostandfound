<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Found Item</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>UofSC Lost & Found</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="lost.html">Report lost</a>
            <a href="found.html">Report found</a>
        </nav>
    </header>

    <main class="form-page">

        <h2>Report a Found Item</h2>

        <p class="form-description">
            Fill out the form below with information about the item you found.
        </p>

        <form>

            <div class="form-group">
                <label for="found-name">Your Name</label>
                <input type="text" id="found-name" name="name" required>
            </div>

            <div class="form-group">
                <label for="found-email">Email</label>
                <input type="email" id="found-email" name="email" required>
            </div>

            <div class="form-group">
                <label for="found-item">Item Name</label>
                <input type="text" id="found-item" name="item" required>
            </div>

            <div class="form-group">
                <label for="found-category">Category</label>

                <select id="found-category" name="category">
                    <option value="">Select a category</option>
                    <option value="electronics">Electronics</option>
                    <option value="clothing">Clothing</option>
                    <option value="keys">Keys</option>
                    <option value="wallet">Wallet / ID</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="found-location">Location Found</label>
                <input type="text" id="found-location" name="location">
            </div>

            <div class="form-group">
                <label for="found-date">Date Found</label>
                <input type="date" id="found-date" name="date">
            </div>

            <div class="form-group">
                <label for="found-description">Description</label>
                <textarea id="found-description" name="description" rows="5"></textarea>
            </div>

            <div class="form-group">
                <label for="found-photo">Upload Photo</label>
                <input type="file" id="found-photo" name="photo">
            </div>

            <button type="submit">Submit Found Item</button>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 UofSC Lost & Found</p>
    </footer>

</body>
</html>
